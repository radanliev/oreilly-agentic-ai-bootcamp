[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oreilly-agentic-ai-bootcamp"
version = "1.0.0"
description = "O'Reilly Live Bootcamp: Securing Agentic AI Systems — five repeatable assurance patterns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.0",
]

[tool.setuptools]
packages = ["shared.assurance", "shared.benchmark"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["shared/tests"]
